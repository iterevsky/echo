<!doctype html>
<!-- Focus probe: real page with saved progress in srcdoc iframe (SW off).
     Reports document.activeElement after the progress overlay appears. -->
<meta charset="utf-8">
<title>focusprobe</title>
<body>
<iframe id="f" style="width:900px;height:400px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');

    try {
        localStorage.setItem('echo_state', JSON.stringify({
            lastChapter: 0, lastVisit: '2026-10-25T10:00:00.000Z'
        }));
    } catch (e) {}

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                f.contentDocument.querySelector('.progress-continue')) {
                clearInterval(poll);
                setTimeout(run, 1000);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try {
            var w = f.contentWindow;
            var d = f.contentDocument;
            var a = d.activeElement;
            log('activeElement: tag=' + a.tagName + ' class=' + a.className + ' id=' + a.id);
            log('primary is button: ' + (d.querySelector('.progress-continue').tagName === 'BUTTON'));
            if (w.__errs.length) log('errors: ' + w.__errs.join(' || '));
            log('DONE');
        } catch (e) { log('RUN ERROR: ' + e.message); }
    }
})();
</script>
