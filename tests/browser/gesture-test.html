<!doctype html>
<!-- Gesture test: real page in srcdoc iframe (SW off, error hook).
     Checks dragstart/contextmenu suppression on images only, intro still
     starts on click, photo viewer closes, film frames don't intercept. -->
<meta charset="utf-8">
<title>gesture-test</title>
<body>
<iframe id="f" style="width:900px;height:400px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');
    try { localStorage.removeItem('echo_state'); } catch (e) {}

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                typeof f.contentWindow.openChapter === 'function') {
                clearInterval(poll);
                setTimeout(run, 800);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try { runInner(); } catch (e) { log('RUN ERROR: ' + e.message); }
    }

    function prevented(el, type) {
        var ev = el.ownerDocument.createEvent('Event');
        ev.initEvent(type, true, true);
        el.dispatchEvent(ev);
        return ev.defaultPrevented;
    }

    function runInner() {
        var w = f.contentWindow, d = f.contentDocument;
        var fails = 0;
        function check(name, cond) { log((cond ? 'PASS  ' : 'FAIL  ') + name); if (!cond) fails++; }
        if (w.__errs.length) log('page errors: ' + w.__errs.join(' || '));

        var coverImg = d.querySelector('#cover-screen img');
        check('cover contextmenu suppressed', prevented(coverImg, 'contextmenu'));
        check('cover dragstart suppressed', prevented(coverImg, 'dragstart'));

        // ordinary click still starts the intro
        d.body.click();
        setTimeout(function () {
            check('intro starts on click', d.getElementById('cover-screen').classList.contains('hide-up'));

            // photo viewer: image suppressed, close still works
            w.openPhoto('img_01.jpg');
            var photoImg = d.getElementById('photo-image');
            check('photo contextmenu suppressed', prevented(photoImg, 'contextmenu'));
            check('photo dragstart suppressed', prevented(photoImg, 'dragstart'));
            w.closePhoto();
            check('photo viewer closes', !d.getElementById('photo-overlay').classList.contains('active'));

            // film frames: no click interception, no drag
            var filmImg = d.querySelector('#film-screen .film-image');
            check('film pointer-events none', getComputedStyle(filmImg).pointerEvents === 'none');
            check('film dragstart suppressed', prevented(filmImg, 'dragstart'));

            // ordinary text paragraph: contextmenu NOT blocked site-wide
            var p = d.querySelector('.contents-item');
            check('contextmenu not blocked on text', !prevented(p, 'contextmenu'));

            log(fails ? 'RESULT: FAILED (' + fails + ')' : 'RESULT: OK');
        }, 1200);
    }
})();
</script>
