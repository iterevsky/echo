<!doctype html>
<!-- Share-card probe: real page in srcdoc iframe (SW disabled, error hook).
     Selects a sentence in the chapter, waits for the share fab, clicks it,
     and reports when the quote card render finished. The PNG downloads. -->
<meta charset="utf-8">
<title>share-test</title>
<body>
<iframe id="f" style="width:1000px;height:600px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');

    try { localStorage.removeItem('echo_state'); } catch (e) {}

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                typeof f.contentWindow.openChapter === 'function') {
                clearInterval(poll);
                setTimeout(run, 1200);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try {
            var w = f.contentWindow;
            if (w.__errs.length) log('page errors: ' + w.__errs.join(' || '));

            // open a chapter first (deep-link path needs no user input)
            w.openChapter(0);
            setTimeout(runSelect, 900);
        } catch (e) { log('RUN ERROR: ' + e.message); }
    }

    function runSelect() {
        try {
            var w = f.contentWindow, d = f.contentDocument;
            var p = d.querySelector('.chapter-text p');
            var range = d.createRange();
            range.selectNodeContents(p);
            var sel = w.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            d.dispatchEvent(new w.Event('selectionchange'));

            setTimeout(function () {
                var btn = d.querySelector('.share-fab');
                if (!btn) { log('NO SHARE BUTTON'); log('DONE'); return; }
                log('fab appeared; sharing…');
                btn.click();
                setTimeout(function () {
                    log('share flow finished; errors: ' + (w.__errs.length ? w.__errs.join(' || ') : 'none'));
                    log('DONE');
                }, 5000);
            }, 900);
        } catch (e) { log('RUN ERROR: ' + e.message); }
    }
})();
</script>
