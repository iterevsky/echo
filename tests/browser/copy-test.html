<!doctype html>
<!-- Copy truthfulness test (hardened): real index.html in a srcdoc iframe,
     SW disabled, clipboard APIs stubbed per ?mode.
     mode=fail     -> both APIs fail -> honest failure label
     mode=fallback -> clipboard rejects, execCommand works -> success
     mode=modern   -> clipboard API resolves -> success -->
<meta charset="utf-8">
<title>copy-test</title>
<body>
<iframe id="f" style="width:900px;height:400px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var p = new URLSearchParams(location.search);
    var mode = p.get('mode') || 'fail';
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var clip={writeText:function(){return ' +
        (mode === 'modern' ? 'Promise.resolve()' : 'Promise.reject(new Error("denied"))') +
        ';}};' +
        'try{Object.defineProperty(navigator,"clipboard",{value:clip,configurable:true});}catch(e){}' +
        'document.execCommand=function(){return ' + (mode === 'modern' || mode === 'fallback' ? 'true' : 'false') + ';};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                f.contentDocument.querySelector('.donate-copy')) {
                clearInterval(poll);
                setTimeout(run, 800);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try { runInner(); } catch (e) { log('RUN ERROR: ' + e.message); }
    }

    function runInner() {
        var w = f.contentWindow, d = f.contentDocument;
        if (w.__errs.length) log('page errors: ' + w.__errs.join(' || '));
        var btn = d.querySelector('.donate-copy');
        btn.click();
        setTimeout(function () {
            log('mode=' + mode + ' label=' + btn.textContent);
            var expect = (mode === 'fail') ? 'Не скопировалось' : 'Скопировано';
            log(btn.textContent === expect ? 'RESULT: OK' : 'RESULT: FAILED');
        }, 400);
    }
})();
</script>
