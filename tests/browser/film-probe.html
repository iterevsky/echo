<!doctype html>
<!-- Film preload probe: real page in srcdoc iframe (SW disabled, error hook);
     reports rIC support, gate state, and manually triggers startFilmPreload. -->
<meta charset="utf-8">
<title>film-probe</title>
<body>
<iframe id="f" style="width:900px;height:300px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');

    try { localStorage.removeItem('echo_state'); } catch (e) {}

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                typeof f.contentWindow.startFilmPreload === 'function') {
                clearInterval(poll);
                setTimeout(run, 800);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try {
            var w = f.contentWindow;
            log('errors: ' + (w.__errs.length ? w.__errs.join(' || ') : 'none'));
            log('rIC supported: ' + ('requestIdleCallback' in w));
            log('typeof startFilmPreload: ' + typeof w.startFilmPreload);
            log('calling startFilmPreload() manually…');
            w.startFilmPreload();
            setTimeout(function () {
                log('errors after manual call: ' + (w.__errs.length ? w.__errs.join(' || ') : 'none'));
                log('DONE — check tests/_frames.log');
            }, 4000);
        } catch (e) { log('RUN ERROR: ' + e.message); }
    }
})();
</script>
