<!doctype html>
<!-- Film check: did the projector sequence actually run?
     The title screen gets 'film-enter' only via the film path. -->
<meta charset="utf-8">
<title>filmcheck</title>
<body>
<iframe id="f" style="width:900px;height:400px"></iframe>
<pre id="out">running…</pre>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) { out.textContent += '\n' + s; }
    var f = document.getElementById('f');
    try { localStorage.removeItem('echo_state'); } catch (e) {}

    var inject =
        '<script>' +
        'window.__errs=[];' +
        'window.onerror=function(m,s,l,c){window.__errs.push(m+" @"+l+":"+c);};' +
        'var nosw={register:function(){return new Promise(function(){});},addEventListener:function(){},controller:null};' +
        'try{Object.defineProperty(navigator,"serviceWorker",{value:nosw,configurable:true});}catch(e){}' +
        'try{HTMLImageElement.prototype.decode=function(){return Promise.resolve();};}catch(e){}' +
        '<\/script>';

    fetch('/index.html').then(function (r) { return r.text(); }).then(function (html) {
        html = html.replace('<head>', '<head><base href="/">');
        html = html.replace('<script src="chapters.js"><\/script>', inject + '<script src="chapters.js"><\/script>');
        f.srcdoc = html;
    });

    var poll = setInterval(function () {
        try {
            if (f.contentWindow && f.contentWindow.__errs &&
                typeof f.contentWindow.startSequence === 'function') {
                clearInterval(poll);
                setTimeout(run, 800);
            }
        } catch (e) {}
    }, 300);

    function run() {
        try {
            var w = f.contentWindow, d = f.contentDocument;
            w.startFilmPreload();
            d.body.click();   // start the intro
            var mid = setTimeout(function () {
                var fs = d.getElementById('film-screen');
                log('mid: film-screen classes: ' + fs.className);
            }, 11000);
            setTimeout(function () {
                var ts = d.getElementById('title-screen');
                log('end: title classes: "' + ts.className + '"');
                log('film ran: ' + (ts.className.indexOf('film-enter') !== -1 ? 'YES' : 'NO'));
                log('errors: ' + (w.__errs.length ? w.__errs.join(' || ') : 'none'));
                log('DONE');
            }, 23000);
        } catch (e) { log('RUN ERROR: ' + e.message); }
    }
})();
</script>
